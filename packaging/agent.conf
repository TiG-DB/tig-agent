# tig-agent configuration. Restart the agent after changing it:
#   sudo systemctl restart tig-agentd

# Where the TiG repository, deploy key and agent state are kept.
data_dir = /var/lib/tig

# The Git remote to push the repository to, e.g. git@github.com:you/machine.git.
# Leave it empty to keep the repository on this machine only.
# Give the deploy key shown by `sudo -u tig tig-agent status` write access to it.
remote =

# Record Docker Compose stacks and their containers (state, health, restarts, CPU and memory), and what changes in
# them. Leave it empty to record nothing about Docker. It is the Docker Engine API, as unix:///path or http://host:port.
# The agent only ever sends GET requests, so point it at a read-only proxy rather than at the Docker socket, which
# would give the tig user control of the machine. For example, with tecnativa/docker-socket-proxy (CONTAINERS=1) on
# the host's loopback:
#   docker_host = http://127.0.0.1:2375
docker_host =

# Name the release an image tag such as `latest` is (e.g. 19.5.5-ce.0), recorded as `version` beside the image. The agent
# asks Docker Hub for the tags that share the digest of each image it runs, which tells Docker Hub the names of the
# public images on this machine and is the only thing the agent requests from the Internet, apart from TiG Notary below.
# Images from other registries, and ones you built yourself, are not looked up. Needs docker_host; with the
# tecnativa/docker-socket-proxy above, also IMAGES=1 on machines whose Docker doesn't report an image's registry digest as
# its ID. Leave it off or `off` to ask nothing.
#   docker_versions = hub
docker_versions =

# How often telemetry is sampled, committed and pushed: a number followed by s, m, h or d.
sample_interval = 60s
commit_interval = 15m
push_interval = 1h

# Have TiG Notary sign the latest commit at each push, so that the repository shows when it existed as well as which device
# wrote it. The agent sends the commit's hash, the time and the device's public key, which tells the notary your address;
# it never sees the repository. The signature is a Git tag, which is pushed with the commits. Signing is best effort: if the
# notary can't be reached the agent pushes anyway and signs at the next push. Leave it empty to ask for no signatures.
#   notary = https://notary.tigdb.org
notary =

# The hostname that publishes the notary's keys, from https://<issuer>/.well-known/tig-public-key. Each signature is
# checked against them before it is kept. Only used when notary is set.
issuer = tigdb.org
