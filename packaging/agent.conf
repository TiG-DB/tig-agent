# tig-agent configuration. Restart the agent after changing it:
#   sudo systemctl restart tig-agentd

# Where the TiG repository, deploy key and agent state are kept.
data_dir = /var/lib/tig

# The Git remote to push the repository to, e.g. git@github.com:you/machine.git.
# Leave it empty to keep the repository on this machine only.
# Give the deploy key shown by `sudo -u tig tig-agent status` write access to it.
remote =

# Record Docker Compose stacks and their containers (state, health, restarts, CPU and memory), and what changes in
# them. Leave it empty to record nothing about Docker. It is the Docker Engine API, as unix:///path or http://host:port.
# The agent only ever sends GET requests, so point it at a read-only proxy rather than at the Docker socket, which
# would give the tig user control of the machine. For example, with tecnativa/docker-socket-proxy (CONTAINERS=1) on
# the host's loopback:
#   docker_host = http://127.0.0.1:2375
docker_host =

# Name the release an image tag such as `latest` is (e.g. 19.5.5-ce.0), recorded as `version` beside the image. The agent
# asks Docker Hub for the tags that share the digest of each image it runs, which tells Docker Hub the names of the
# public images on this machine and is the only thing the agent ever requests from the Internet. Images from other
# registries, and ones you built yourself, are not looked up. Needs docker_host; with the tecnativa/docker-socket-proxy
# above, also IMAGES=1 on machines whose Docker doesn't report an image's registry digest as its ID. Leave it off or
# `off` to ask nothing.
#   docker_versions = hub
docker_versions =

# How often telemetry is sampled, committed and pushed: a number followed by s, m, h or d.
sample_interval = 60s
commit_interval = 15m
push_interval = 1h
